name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm 12 enforces package.json allowScripts, including skipped GPU downloads.
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Packaged Linux UI
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:packaged
      - name: Packaged Windows and macOS UI
        if: runner.os != 'Linux'
        run: npm run test:e2e:packaged
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
